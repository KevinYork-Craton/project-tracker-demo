<template>
    <lightning-card title="Project Details" icon-name="custom:custom55">
        <div slot="actions">
            <template lwc:if={isEditing}>
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
            </template>
            <template lwc:else>
                <lightning-button label="Edit" icon-name="utility:edit" onclick={handleEdit}></lightning-button>
            </template>
        </div>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={isEditing}>
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    onsuccess={handleSuccess}
                    onerror={handleError}
                >
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={editableFields} for:item="field">
                            <div key={field} class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name={field}></lightning-input-field>
                            </div>
                        </template>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-output-field field-name={completedDateField}></lightning-output-field>
                        </div>
                    </div>
                    <div class="slds-m-top_small slds-text-align_right">
                        <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>
            <template lwc:else>
                <lightning-record-view-form record-id={recordId} object-api-name={objectApiName} key={viewKey}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={allFields} for:item="field">
                            <div key={field} class="slds-col slds-size_1-of-2">
                                <lightning-output-field field-name={field}></lightning-output-field>
                            </div>
                        </template>
                    </div>
                </lightning-record-view-form>
            </template>
        </div>
    </lightning-card>
</template>
